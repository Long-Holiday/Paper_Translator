# Paper Translator Nginx 反向代理配置参考
server {
    listen 80;
    server_name your-domain.com; # 替换为您的域名或公网 IP

    # 允许上传大文件论文 PDF（建议不低于 50M）
    client_max_body_size 101M; # 100MB PDF + multipart headers; app checks file size

    # Vite asset names include hashes; cache them to reduce repeated transfers.
    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 1. 针对 SSE 翻译流长连接的专用代理配置（关键：禁止缓冲）
    location /api/papers/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 禁用 Nginx 响应缓冲，确保翻译进度实时秒级推送到浏览器
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # 保持连接不超时
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. 全局 API 与静态资源代理
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持 WebSocket（若未来需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
